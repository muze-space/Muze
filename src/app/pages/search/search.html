@if (query()) {
  <h2>Search results for "{{ query() }}"</h2>
} @else if (genre()) {
  <h2>{{ genre()!.label }}</h2>
} @else {
  <h2>Search</h2>
}

@if (hasCriteria()) {
  <app-tracks [genre]="genre()" [order]="trackOrder.Relevance" [search]="query()"></app-tracks>
} @else {
  <p>Start typing in the search box above to find tracks.</p>
}
