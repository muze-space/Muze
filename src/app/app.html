<div [class.app-shell--has-player]="playerService.currentTrack()" class="app-shell">
  <div class="app-body">
    <app-sidebar></app-sidebar>

    <div class="app-main">
      <app-header></app-header>
      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
  <app-footer></app-footer>
</div>

@switch (modalService.activeModal()?.kind) {
  @case ('login') {
    <app-login></app-login>
  }
  @case ('createPlaylist') {
    <app-playlist-form-modal></app-playlist-form-modal>
  }
  @case ('renamePlaylist') {
    <app-playlist-form-modal></app-playlist-form-modal>
  }
  @case ('deletePlaylist') {
    <app-delete-playlist-modal></app-delete-playlist-modal>
  }
}
<app-audio-player></app-audio-player>
<app-toast></app-toast>
