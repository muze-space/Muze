<aside class="sidebar">
  <a class="sidebar__brand" routerLink="{{ AppRoutes.Home }}">
    <img alt="Muze" class="sidebar__logo" height="32" ngSrc="/logo.png" width="32" />
    <span class="sidebar__brand-name">Muze</span>
  </a>

  <nav aria-label="Primary" class="sidebar__nav">
    <ul>
      <li>
        <a [routerLinkActiveOptions]="{ exact: true }" routerLink="{{ AppRoutes.Home }}" routerLinkActive="active">
          <span class="sidebar__icon">
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <path d="M3 11l9-8 9 8" />
              <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
            </svg>
          </span>
          <span class="sidebar__label">Discover</span>
        </a>
      </li>
      <li>
        <a routerLink="{{ AppRoutes.Search }}" routerLinkActive="active">
          <span class="sidebar__icon">
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" x2="16.65" y1="21" y2="16.65" />
            </svg>
          </span>
          <span class="sidebar__label">Search</span>
        </a>
      </li>
      <li>
        <a routerLink="{{ AppRoutes.Library }}" routerLinkActive="active">
          <span class="sidebar__icon">
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <rect height="18" rx="1" width="7" x="3" y="3" />
              <rect height="12" rx="1" width="7" x="14" y="3" />
            </svg>
          </span>
          <span class="sidebar__label">Library</span>
        </a>
      </li>
      <li>
        <a routerLink="{{ AppRoutes.About }}" routerLinkActive="active">
          <span class="sidebar__icon">
            <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <line x1="12" x2="12" y1="11" y2="16" />
              <circle cx="12" cy="7.5" fill="currentColor" r="0.5" />
            </svg>
          </span>
          <span class="sidebar__label">About Us</span>
        </a>
      </li>
    </ul>
  </nav>

  <section aria-label="Playlists" class="sidebar__playlists">
    <div class="sidebar__section-head">
      <h2 class="sidebar__section-title">Playlists</h2>
      <button
        (click)="onCreatePlaylist()"
        aria-label="Create playlist"
        class="sidebar__create"
        title="Create playlist"
        type="button"
      >
        +
      </button>
    </div>

    <ul class="sidebar__playlist-list">
      @for (playlist of playlists(); track playlist.id) {
        <li>
          <a
            [routerLink]="['/' + AppRoutes.Playlist, playlist.id]"
            [title]="playlist.name"
            routerLinkActive="active"
            >{{ playlist.name }}</a
          >
        </li>
      } @empty {
        <li class="sidebar__playlist-empty">No playlists yet</li>
      }
    </ul>
  </section>
</aside>
