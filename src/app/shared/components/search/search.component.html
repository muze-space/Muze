<div class="search-section">
  <form (ngSubmit)="submitSearch()" [formGroup]="searchForm" class="search" role="search">
    <input class="search__input" formControlName="query" id="header-search" name="query"
           placeholder="Search…" type="search" />
    <button class="search__button" type="submit">Find</button>
  </form>
</div>
