<li
  (click)="onTrackClick()"
  [class.active]="isCurrentTrack()"
  [class.playing]="isPlaying()"
  class="row"
>
  <button
    (click)="onPlayButtonClick($event)"
    [attr.aria-label]="playLabel()"
    [attr.aria-pressed]="isPlaying()"
    class="play-btn"
    type="button"
  >
    <img [alt]="track().album_name" [src]="track().album_image | cover: 100" class="cover" />
  </button>
  <div class="info">
    <span class="title">{{ track().name }}</span>
    <a
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      [routerLink]="['/' + AppRoutes.Artist, track().artist_id]"
      class="artist"
      >{{ track().artist_name }}</a
    >
  </div>
  <a
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
    [routerLink]="['/' + AppRoutes.Album, track().album_id]"
    class="album"
    >{{ track().album_name }}</a
  >
  <span class="release-date">{{ track().releasedate | date: 'yyyy' }}</span>
  <span class="duration">{{ track().duration | duration }}</span>
  <app-track-menu
    (click)="$event.stopPropagation()"
    (removeRequested)="onRemoveRequested($event)"
    [removable]="removable()"
    [track]="track()"
  ></app-track-menu>
  <button
    (click)="onLikeClick($event)"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.stopPropagation()"
    [attr.aria-label]="isLiked() ? 'Unlike' : 'Like'"
    [attr.aria-pressed]="isLiked()"
    [class.liked]="isLiked()"
    class="like-btn"
    type="button"
  >
    <app-icon [name]="isLiked() ? 'heart-filled' : 'heart'"></app-icon>
  </button>
  @if (isCurrentTrack()) {
    <span aria-hidden="true" class="state">
      @if (isPlaying()) {
        <span class="equalizer">
          <span class="equalizer__bar"></span>
          <span class="equalizer__bar"></span>
          <span class="equalizer__bar"></span>
        </span>
      } @else {
        <app-icon name="play"></app-icon>
      }
    </span>
  }
</li>
