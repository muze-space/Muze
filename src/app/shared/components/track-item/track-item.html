<li
  (click)="onTrackClick()"
  (keydown.enter)="onTrackClick()"
  (keydown.space)="$event.preventDefault(); onTrackClick()"
  [attr.aria-label]="track().name + ' — ' + track().artist_name"
  [attr.aria-pressed]="isPlaying()"
  [class.active]="isCurrentTrack()"
  [class.playing]="isPlaying()"
  [class.search-version]="isSearchVersion()"
  role="button"
  tabindex="0"
>
  <img [alt]="track().album_name" [src]="track().album_image" class="cover" />
  <div class="info">
    <span class="title">{{ track().name }}</span>
    <a
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      [routerLink]="[AppRoutes.Artist, track().artist_id]"
      class="artist"
      >{{ track().artist_name }}</a
    >
  </div>
  @if (!isSearchVersion()) {
    <span class="album">{{ track().album_name }}</span>
    <span class="release-date">{{ track().releasedate | date:'yyyy' }}</span>
    <span class="duration">{{ track().duration | duration }}</span>
  }
  @if (isCurrentTrack()) {
    <span class="play-btn">
      {{ isPlaying() ? '⏸' : '▶' }}
    </span>
  }
</li>
