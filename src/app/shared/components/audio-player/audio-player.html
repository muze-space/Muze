@if (currentTrack(); as track) {
  <div class="player-bar">
    <audio
      #audioElement
      (ended)="onEnded()"
      (loadedmetadata)="onLoadedMetadata($event)"
      (timeupdate)="onTimeUpdate($event)"
      [loop]="isRepeatOne()"
      hidden
    ></audio>

    <div class="player-bar__track">
      <button
        (click)="onOpenNowPlaying()"
        aria-label="Open now playing"
        class="player-bar__cover-btn"
        title="Now playing"
        type="button"
      >
        <img
          [alt]="track.album_name"
          [src]="track.album_image | cover: 130"
          class="player-bar__cover"
        />
      </button>
      <div class="player-bar__info">
        <span class="player-bar__title">{{ track.name }}</span>
        <span class="player-bar__artist">{{ track.artist_name }}</span>
      </div>
    </div>

    <div class="player-bar__center">
      <div class="player-bar__buttons">
        <button
          (click)="onToggleShuffle()"
          [attr.aria-pressed]="isShuffled()"
          [class.player-bar__btn--active]="isShuffled()"
          aria-label="Shuffle"
          class="player-bar__btn"
          title="Shuffle"
          type="button"
        >
          <app-icon name="shuffle"></app-icon>
        </button>
        <button
          (click)="onPrevious()"
          aria-label="Previous track"
          class="player-bar__btn"
          type="button"
        >
          <app-icon name="previous"></app-icon>
        </button>
        <button
          (click)="onTogglePlay()"
          [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
          class="player-bar__btn player-bar__btn--play"
          type="button"
        >
          <app-icon [name]="isPlaying() ? 'pause' : 'play'"></app-icon>
        </button>
        <button (click)="onNext()" aria-label="Next track" class="player-bar__btn" type="button">
          <app-icon name="next"></app-icon>
        </button>
        <button
          (click)="onCycleRepeat()"
          [attr.aria-label]="'Repeat: ' + repeatMode()"
          [class.player-bar__btn--active]="repeatMode() !== RepeatMode.Off"
          [title]="'Repeat: ' + repeatMode()"
          class="player-bar__btn player-bar__btn--repeat"
          type="button"
        >
          <app-icon [name]="isRepeatOne() ? 'repeat-one' : 'repeat'"></app-icon>
        </button>
      </div>

      <div class="player-bar__seek">
        <span class="player-bar__time">{{ currentTime() | duration }}</span>
        <input
          (input)="onSeek($event)"
          [max]="duration() || 0"
          [value]="currentTime()"
          aria-label="Seek"
          class="player-bar__range"
          min="0"
          type="range"
        />
        <span class="player-bar__time">{{ duration() | duration }}</span>
      </div>
    </div>

    <div class="player-bar__right">
      <button
        (click)="onToggleQueue()"
        [attr.aria-pressed]="isQueueOpen()"
        [class.player-bar__btn--active]="isQueueOpen()"
        aria-label="Queue"
        class="player-bar__btn"
        title="Queue"
        type="button"
      >
        <app-icon name="queue"></app-icon>
      </button>
      <button
        (click)="onToggleMute()"
        [attr.aria-label]="volume() === 0 ? 'Unmute' : 'Mute'"
        class="player-bar__btn player-bar__volume-icon"
        title="Mute (M)"
        type="button"
      >
        <app-icon [name]="volumeIcon()"></app-icon>
      </button>
      <input
        (input)="onVolumeChange($event)"
        [value]="volume()"
        aria-label="Volume"
        class="player-bar__range player-bar__range--volume"
        max="1"
        min="0"
        step="0.01"
        type="range"
      />
    </div>
  </div>

  <app-queue-panel></app-queue-panel>
  <app-now-playing></app-now-playing>
}
